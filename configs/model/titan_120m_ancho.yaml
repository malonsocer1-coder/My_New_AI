# Alternativa "ancha" de ~120 M parámetros (768 x 15 capas) para comparar en su GPU:
# menos capas y matrices más grandes -> algo más de tokens/s, pero a igual número de
# tokens la literatura favorece la versión profunda (titan_120m.yaml).
# Compare con:  titan bench --config configs/train/pc_120m_base.yaml --find-batch
#               titan bench --config configs/train/pc_120m_base.yaml --find-batch \
#                   --set model_config=configs/model/titan_120m_ancho.yaml
name: titan-120m-ancho
vocab_size: 32768
dim: 768
n_layers: 15
n_heads: 12
n_kv_heads: 4
multiple_of: 256        # ffn_dim = 2048
max_seq_len: 2048
rope_theta: 10000.0
tie_embeddings: true
activation_checkpointing: false
ce_chunk_size: 1024
