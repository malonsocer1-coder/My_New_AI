# Etapa A: validación técnica en la CPU de la sesión de desarrollo.
model_config: configs/model/titan_stage_a.yaml
train:
  run_name: stage_a
  out_dir: runs/stage_a
  task: pretrain
  data: data/stage_a/manifest.json
  tokenizer: data/stage_a/tokenizer
  seq_len: 256
  micro_batch_size: 16
  grad_accum_steps: 1
  max_steps: 5000
  lr: 1.5e-3
  min_lr: 1.5e-4
  warmup_steps: 200
  schedule: cosine
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: fp32
  compile: true
  device: cpu
  num_threads: 4
  eval_interval: 500
  eval_windows: 64
  eval_batch_size: 32
  log_interval: 25
  ckpt_interval: 250
  keep_last: 3
  keep_every: 1000
  sample_prompts:
    - "El Parlamento Europeo"
    - "def suma(a, b):"
    - "Pregunta: ¿Cuánto es 25 + 17?\nRespuesta:"
    - "It was a dark and stormy night"
  sample_max_new_tokens: 40
  seed: 1234
  gpu_hour_usd: 0.0
