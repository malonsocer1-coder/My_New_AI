# Preentrenamiento de TITAN-1B en 8×H100 (FSDP2). ~100 000 M tokens.
# 8 GPU × 8 secuencias × 2048 tokens × 4 de acumulación = 524 288 tokens por paso.
model_config: configs/model/titan_1b.yaml
train:
  run_name: titan-1b
  out_dir: runs/titan-1b
  task: pretrain
  data: data/cloud_main/manifest.json
  tokenizer: data/cloud_main/tokenizer
  seq_len: 2048
  micro_batch_size: 8
  grad_accum_steps: 4
  max_steps: 190000
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 2000
  schedule: wsd
  wsd_decay_frac: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: bf16
  compile: true
  parallel: fsdp
  eval_interval: 2000
  eval_windows: 128
  eval_batch_size: 8
  log_interval: 20
  ckpt_interval: 1000
  keep_last: 3
  keep_every: 20000
  sample_prompts: ["La Ciudad de México es", "def es_primo(n):", "Pregunta: ¿Cuánto es 347 + 589?\nRespuesta:"]
  seed: 1234
