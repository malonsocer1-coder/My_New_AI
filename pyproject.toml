[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-ai"
version = "0.1.0"
description = "TITAN AI: modelo de lenguaje propio entrenado desde cero, con agente y herramientas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.6",
  "numpy>=1.26",
  "tokenizers>=0.20",
  "safetensors>=0.4",
  "pyyaml>=6",
  "psutil>=5.9",
]

[project.optional-dependencies]
cloud = ["datasets>=3.0", "requests>=2.31", "boto3>=1.34"]
export = ["gguf>=0.10"]
docs = ["pypdf>=4", "openpyxl>=3.1", "python-docx>=1.1", "python-pptx>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
titan = "titan.cli:main"

[tool.setuptools.packages.find]
include = ["titan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
